      </div>
      <div class="planning-nav">
        <button id="plan-prev">◀</button>
        <button class="today-btn" id="plan-today">Aujourd'hui</button>
        <button id="plan-next">▶</button>
        <span class="planning-period" id="plan-period"></span>
      </div>
    </div>
    <div id="gantt-container"></div>
    <div class="no-dates-section" id="no-dates-section"></div>`;

  // Restaurer filtre
  const sel = document.getElementById('planning-proj-filter');
  sel.value = planningFilter;
  sel.addEventListener('change', e=>{ planningFilter = e.target.value; drawGantt(); });

  document.getElementById('plan-prev').addEventListener('click',  ()=>{ planningOffset--; drawGantt(); });
  document.getElementById('plan-next').addEventListener('click',  ()=>{ planningOffset++; drawGantt(); });
  document.getElementById('plan-today').addEventListener('click', ()=>{ planningOffset=0; drawGantt(); });

  // Restaurer et brancher la profondeur
  const depthSel = document.getElementById('planning-depth');
  depthSel.value = String(planningDepth);
  depthSel.addEventListener('change', e=>{
    planningDepth = Number(e.target.value);
    planningOffset = 0;
    drawGantt();
  });

  drawGantt();
}

function drawGantt(){
  // ── Période affichée : mois courant + offset, étalé sur ~2 mois glissants
  const NOW     = new Date();
  const anchor  = new Date(NOW.getFullYear(), NOW.getMonth() + planningOffset, 1);
  const viewStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const viewEnd = new Date(anchor.getFullYear(), anchor.getMonth() + planningDepth, 0);

  // Label période
  const monthFmt = new Intl.DateTimeFormat('fr-FR', {month:'long', year:'numeric'});
  const m1 = new Intl.DateTimeFormat('fr-FR',{month:'short'}).format(viewStart);
  const m2 = new Intl.DateTimeFormat('fr-FR',{month:'short',year:'numeric'}).format(viewEnd);
  document.getElementById('plan-period').textContent = `${m1} – ${m2}`;

  const totalDays = daysBetween(viewEnd, viewStart) + 1;

  // ── Filtrer activités
  let acts = planningAct;
  if(planningFilter !== '__all__'){
    const fid = Number(planningFilter);
    acts = acts.filter(a=> a.projetId===fid || String(a.projet)===String(planningFilter));
  }

  // Séparer avec dates / sans dates
  const withDates = acts
  .filter(a=> a.dateDebut || a.echeance)
  .sort((a,b)=>{
    const da = a.dateDebut || a.echeance;
    const db = b.dateDebut || b.echeance;
    return da - db;
  });
  const noDates   = acts.filter(a=> !a.dateDebut && !a.echeance);

  // ── Construire l'en-tête (mois + jours)
  // Générer tous les jours
  const days = [];
  for(let d=new Date(viewStart); d<=viewEnd; d.setDate(d.getDate()+1)){
    days.push(new Date(d));
  }

  // Grouper par mois pour l'en-tête mois
  const monthGroups = [];
  days.forEach(d=>{
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    if(!monthGroups.length || monthGroups[monthGroups.length-1].key !== key){
      monthGroups.push({key, label: new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(d), count:1});
    } else {
      monthGroups[monthGroups.length-1].count++;
    }
  });

  const dayPct = 100 / totalDays; // % par jour

  // ── Calcul position aujourd'hui
  const todayOffset = daysBetween(NOW, viewStart);
  const todayPct    = ((todayOffset + 0.5) / totalDays) * 100;
  const showToday   = todayOffset >= 0 && todayOffset < totalDays;

  // ── HTML header
  const monthRowHtml = monthGroups.map(m=>
    `<div class="gh-month-cell" style="flex:${m.count}">${m.label}</div>`
  ).join('');

  const daysRowHtml = days.map(d=>{
    const isToday   = d.toDateString() === NOW.toDateString();
    const isWeekend = d.getDay()===0 || d.getDay()===6;
    const cls = [isToday?'today':'', isWeekend?'weekend':''].filter(Boolean).join(' ');
    return`<div class="gh-day ${cls}" style="flex:1">${d.getDate()}</div>`;
  }).join('');

  // ── HTML lignes activités
  const rowsHtml = withDates.map(a=>{
    // Dates effectives : si manquante on utilise l'autre
    const start = a.dateDebut || a.echeance;
    const end   = a.echeance  || a.dateDebut;

    // Clamp dans la vue
    const clampStart = start < viewStart ? viewStart : start;
    const clampEnd   = end   > viewEnd   ? viewEnd   : end;

    // Si complètement hors vue
    if(clampStart > viewEnd || clampEnd < viewStart){
      // Afficher quand même la ligne mais sans barre (activité hors période)
      return buildGanttRow(a, null, null, totalDays, days, showToday, todayPct);
    }

    const startPct = (daysBetween(clampStart, viewStart) / totalDays) * 100;
    const widthPct = Math.max(0.5, ((daysBetween(clampEnd, clampStart)+1) / totalDays) * 100);

    return buildGanttRow(a, startPct, widthPct, totalDays, days, showToday, todayPct);
  }).join('');

// ── HTML lignes congés / astreintes / formations (toujours affichées, indépendamment du filtre projet)
const visibleAbsences = planningAbsences.filter(a=>{
  const start = a.dateDebut || a.echeance;
  const end   = a.echeance  || a.dateDebut;
  // Vérifier que les dates existent avant de comparer
  if(!start || !end) return false;
  return !(end < viewStart || start > viewEnd);
}).sort((a,b)=>{
  // Tri chronologique par date de début
  const dateA = a.dateDebut || a.echeance;
  const dateB = b.dateDebut || b.echeance;
  return dateA - dateB;
});
  const absencesRowsHtml = visibleAbsences.map(a=>{
    const start = a.dateDebut || a.echeance, end = a.echeance || a.dateDebut;
    const clampStart = start < viewStart ? viewStart : start;
    const clampEnd   = end   > viewEnd   ? viewEnd   : end;
    const startPct = (daysBetween(clampStart, viewStart) / totalDays) * 100;
    const widthPct = Math.max(0.5, ((daysBetween(clampEnd, clampStart)+1) / totalDays) * 100);
    return buildGanttRow(a, startPct, widthPct, totalDays, days, showToday, todayPct);
  }).join('');

  // ── Assembler
  const gridTemplate = `${GANTT_LABEL_W}px 1fr`;

  const html = `
    <div class="gantt-wrap">
      <div class="gantt-header" style="grid-template-columns:${gridTemplate}">
        <div class="gh-label" style="grid-row:1/3;display:flex;align-items:center;font-size:12px;color:var(--text-faint);">Activité</div>
        <div style="display:flex;" class="gh-month-row">${monthRowHtml}</div>
        <div class="gh-days">${daysRowHtml}</div>
      </div>
      <div class="gantt-body">
        ${rowsHtml || '<div class="planning-empty">Aucune activité avec des dates sur cette période.</div>'}
      </div>
      ${absencesRowsHtml ? `
      <div class="gantt-divider">Congés, astreintes et formations</div>
      <div class="gantt-body">${absencesRowsHtml}</div>` : ''}
    </div>`;

  document.getElementById('gantt-container').innerHTML = html;

  // ── Section sans dates
  const ndEl = document.getElementById('no-dates-section');
  if(noDates.length){
    ndEl.innerHTML = `
      <h3>⚠️ Activités sans dates (${noDates.length})</h3>
      <div class="no-dates-list">
        ${noDates.map(a=>{
          const color = STATUT_BAR_COLOR[a.statut]||'#5D7480';
          return`<div class="no-dates-chip">
            <span class="chip-dot" style="background:${color}"></span>
            <span>${esc(a.activite||'—')}</span>
            ${a.projet?`<span style="color:var(--text-faint);font-size:10px;">· ${esc(a.projet)}</span>`:''}
          </div>`;
        }).join('')}
      </div>`;
  } else {
    ndEl.innerHTML = '';
  }
}

function buildGanttRow(a, startPct, widthPct, totalDays, days, showToday, todayPct){
  const color    = STATUT_BAR_COLOR[a.statut] || '#5D7480';
  const gridTpl  = `${GANTT_LABEL_W}px 1fr`;
  // const overdue  = a.echeance && a.statut!=='Terminé' && a.echeance < new Date(); ← SUPPRIMÉ

  // Colonnes weekend en fond
  const weekendCols = days.map((d,i)=>{
    if(d.getDay()===0||d.getDay()===6){
      const left = (i/totalDays)*100;
      const w    = (1/totalDays)*100;
      return`<div class="gantt-weekend-col" style="left:${left}%;width:${w}%"></div>`;
    }
    return'';
  }).join('');

  const barHtml = startPct !== null
    ? `<div class="gantt-bar" style="left:${startPct}%;width:${widthPct}%;background:${color};"
        title="${esc(a.activite)} · ${fmtDate(a.dateDebut)} → ${fmtDate(a.echeance)}">
        ${esc(a.activite||'—')}
       </div>`
    : `<div style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-faint);">hors période</div>`;

  const todayLine = showToday
    ? `<div class="gantt-today-line" style="left:${todayPct}%"></div>`
    : '';

  return`
    <div class="gantt-row" style="grid-template-columns:${gridTpl}">
      <div class="gr-label" title="${esc(a.activite||'—')}">
        <span class="chip-dot" style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block;"></span>
        <div style="min-width:0;">
          <div class="gr-name">${esc(a.activite||'—')}</div>
          ${a.projet?`<div class="gr-proj">${esc(a.projet)}</div>`:''}
        </div>
      </div>
      <div class="gr-timeline" style="position:relative;">
        ${weekendCols}
        ${barHtml}
        ${todayLine}
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   ONGLET RAPPORT
══════════════════════════════════════════════ */
let rapportConfig = null;
let rapportPeriodMode = 'trimestre'; // 'mois_precedent' | 'trimestre' | 'libre'
let rapportCustomStart = null;
let rapportCustomEnd = null;

function computeRapportPeriod(){
  const NOW = new Date();
  if (rapportPeriodMode === 'mois_precedent'){
    const start = new Date(NOW.getFullYear(), NOW.getMonth()-1, 1);
    const end   = new Date(NOW.getFullYear(), NOW.getMonth(), 0);
    return { start, end, label: new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(start) };
  }
  if (rapportPeriodMode === 'libre' && rapportCustomStart && rapportCustomEnd){
    return { start: rapportCustomStart, end: rapportCustomEnd, label: `${fmtDate(rapportCustomStart)} → ${fmtDate(rapportCustomEnd)}` };
  }
  // trimestre en cours
  const qStartMonth = Math.floor(NOW.getMonth()/3)*3;
  const start = new Date(NOW.getFullYear(), qStartMonth, 1);
  const end   = new Date(NOW.getFullYear(), qStartMonth+3, 0);
  const m1 = new Intl.DateTimeFormat('fr-FR',{month:'long'}).format(start);
  const m2 = new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(end);
  return { start, end, label: `${m1} - ${m2}` };
}

function overlapDays(start, end, periodStart, periodEnd){
  const s = start < periodStart ? periodStart : start;
  const e = end > periodEnd ? periodEnd : end;
  if (e < s) return 0;
  return daysBetween(e, s) + 1;
}

async function renderRapport(config){
  rapportConfig = config;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Chargement du rapport…</div>';

  // ── Activités (+ résolution du nom de projet, comme sur les autres onglets)
  let projIdToNom = {};
  if (config.projets){
    const raw = await fetchTableSafe(config.projets.tableName);
    if (raw){ const PF = config.projets.fields; toRows(raw).rows.forEach(r=>{ projIdToNom[r.id] = r[PF.projet] || '—'; }); }
  }
  const actRaw = await fetchTableSafe(config.activites.tableName);
  if (!actRaw){ content.innerHTML = `<div class="error">Table activités introuvable.</div>`; return; }
  const F = config.activites.fields;
  const act = toRows(actRaw).rows.map(r=>{
    const rawProjet = r[F.projet];
    let projetNom;
    if (typeof rawProjet==='number' && projIdToNom[rawProjet]) projetNom = projIdToNom[rawProjet];
    else if (rawProjet!==null && rawProjet!==undefined && rawProjet!=='') projetNom = String(rawProjet);
    else projetNom = '';
    return {
      activite:r[F.activite], projet:projetNom, statut:r[F.statut], responsable:r[F.responsable],
      dateDebut:gristDateToDate(r[F.dateDebut]), echeance:gristDateToDate(r[F.echeance]),
      joursAttente:r[F.joursAttente]
    };
  });

  const absences = await loadPlanningAbsences(config);

  buildRapportUI(content, act, absences);
}

function buildRapportUI(content, act, absences){
  content.innerHTML = `
    <div class="rp-toolbar">
      <div>
        <h1>Rapport d'activité</h1>
        <p class="subtitle" id="rp-period-label"></p>
      </div>
      <div class="rp-controls">
        <select class="rp-select" id="rp-mode">
          <option value="mois_precedent" ${rapportPeriodMode==='mois_precedent'?'selected':''}>Mois précédent</option>
          <option value="trimestre" ${rapportPeriodMode==='trimestre'?'selected':''}>Trimestre en cours</option>
          <option value="libre" ${rapportPeriodMode==='libre'?'selected':''}>Dates libres…</option>
        </select>
        <span id="rp-custom-dates" style="display:${rapportPeriodMode==='libre'?'flex':'none'};gap:6px;">
          <input type="date" class="rp-date" id="rp-start" value="${rapportCustomStart?rapportCustomStart.toISOString().slice(0,10):''}" />
          <input type="date" class="rp-date" id="rp-end" value="${rapportCustomEnd?rapportCustomEnd.toISOString().slice(0,10):''}" />
        </span>
        <button class="rp-btn" id="rp-print">Imprimer / PDF</button>
      </div>
    </div>
    <div id="rp-body"></div>
  `;

  document.getElementById('rp-print').addEventListener('click', () => window.print());
  document.getElementById('rp-mode').addEventListener('change', (e) => {
    rapportPeriodMode = e.target.value;
    document.getElementById('rp-custom-dates').style.display = rapportPeriodMode==='libre' ? 'flex' : 'none';
    if (rapportPeriodMode !== 'libre') renderRapportBody(act, absences);
  });
  document.getElementById('rp-start').addEventListener('change', (e) => { rapportCustomStart = e.target.value ? new Date(e.target.value+'T00:00:00') : null; if(rapportCustomStart && rapportCustomEnd) renderRapportBody(act, absences); });
  document.getElementById('rp-end').addEventListener('change', (e) => { rapportCustomEnd = e.target.value ? new Date(e.target.value+'T00:00:00') : null; if(rapportCustomStart && rapportCustomEnd) renderRapportBody(act, absences); });

  renderRapportBody(act, absences);
}

function renderRapportBody(act, absences){
  const { start, end, label } = computeRapportPeriod();
  document.getElementById('rp-period-label').textContent = label.charAt(0).toUpperCase()+label.slice(1);

  const terminees = act.filter(a => a.statut==='Terminé' && a.echeance && a.echeance>=start && a.echeance<=end);
  const enCours = act.filter(a => a.statut==='En cours' && a.dateDebut && a.dateDebut<=end && (!a.echeance || a.echeance>=start));
  const bloquees = act.filter(a => a.statut==='En attente').map(a => {
    let jours = a.joursAttente!==null && a.joursAttente!==undefined && a.joursAttente!=='' ? Number(a.joursAttente) : (a.dateDebut ? daysBetween(new Date(), a.dateDebut) : 0);
    return { ...a, jours };
  }).sort((a,b) => b.jours - a.jours);

const conges = absences.filter(a => {
  if(a.statut !== 'Congé') return false;
  const aStart = a.dateDebut || a.echeance;
  const aEnd   = a.echeance  || a.dateDebut;
  if(!aStart || !aEnd) return false;
  return !(aEnd < start || aStart > end);
});
  const joursConges = conges.reduce((sum,a) => sum + overlapDays(a.dateDebut||a.echeance, a.echeance||a.dateDebut, start, end), 0);
const astreintesFormations = absences.filter(a => {
  if(a.statut!=='Astreinte' && a.statut!=='Formation') return false;
  const aStart = a.dateDebut || a.echeance;
  const aEnd   = a.echeance  || a.dateDebut;
  if(!aStart || !aEnd) return false;
  return !(aEnd < start || aStart > end);
});

  const projetsTouches = new Set([...terminees, ...enCours].map(a=>a.projet).filter(Boolean)).size;
  const blocagesLongs = bloquees.filter(b => b.jours >= 30).length;

  const commentKey = 'rapport-comment-' + label;
  const savedComment = localStorage.getItem(commentKey) || '';

  document.getElementById('rp-body').innerHTML = `
    <div class="kpi-strip">
      <div class="kpi accent-neutre"><div class="value">${projetsTouches}</div><div class="label">Projets touchés sur la période</div></div>
      <div class="kpi accent-neutre"><div class="value">${terminees.length}</div><div class="label">Activités terminées</div></div>
      <div class="kpi ${blocagesLongs>0?'accent-jaune':'accent-neutre'}"><div class="value">${blocagesLongs}</div><div class="label">Blocages en attente depuis plus de 30 jours</div></div>
      <div class="kpi accent-neutre"><div class="value">${joursConges}</div><div class="label">Jours de congé sur la période</div></div>
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <h2>Terminé sur la période</h2>
      <p style="color:var(--text-faint);font-size:12px;margin:0 0 14px;">${terminees.length} activité${terminees.length>1?'s':''}</p>
      ${terminees.length ? terminees.map(a => `
        <div class="rp-item-row">
          <div><div class="title">${esc(a.activite||'—')}</div><div class="sub">${esc(a.projet||'')}</div></div>
          <div class="date">${fmtDate(a.echeance)}</div>
          <div class="check">✓</div>
        </div>`).join('') : '<div class="empty-note">Aucune activité clôturée sur la période.</div>'}
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <h2>En cours, en progression</h2>
      <p style="color:var(--text-faint);font-size:12px;margin:0 0 14px;">Activités actives sur la période, même sans clôture</p>
      ${enCours.length ? enCours.map(a => `
        <div class="rp-prog-row">
          <div class="top"><span class="name">${esc(a.activite||'—')}<span class="proj">${esc(a.projet||'')}</span></span></div>
        </div>`).join('') : '<div class="empty-note">Aucune activité en cours sur la période.</div>'}
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <h2>Bloqué en dehors de vous <span style="color:var(--text-faint);font-weight:400;font-family:var(--font-body);font-size:12px;">${bloquees.length}</span></h2>
      <p style="color:var(--text-faint);font-size:12px;margin:0 0 14px;">Situation actuelle, indépendamment de la période choisie</p>
      ${bloquees.length ? bloquees.map(a => {
        const level = vigilanceForDays(a.jours);
        return `<div class="log-row">
          <div><div class="title">${esc(a.activite||'—')}</div><div class="sub">${esc(a.projet||'')}</div></div>
          <div class="who">${esc(a.responsable||'—')}</div>
          <div class="days ${level}">${a.jours} j</div>
        </div>`;
      }).join('') : '<div class="empty-note">Aucun blocage en cours.</div>'}
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <h2>Congés, astreintes et formations</h2>
      <p style="color:var(--text-faint);font-size:12px;margin:0 0 14px;">Temps mobilisé en dehors du suivi de projet</p>
      <div class="rp-ticker-grid">
        ${conges.map(a => `
          <div class="rp-tk-item"><span class="dot" style="background:${STATUT_BAR_COLOR['Congé']}"></span>
            <div><div class="tk-title">Congé</div><div class="tk-value">${fmtDate(a.dateDebut)} → ${fmtDate(a.echeance)}</div></div>
          </div>`).join('')}
        ${astreintesFormations.map(a => `
          <div class="rp-tk-item"><span class="dot" style="background:${STATUT_BAR_COLOR[a.statut]}"></span>
            <div><div class="tk-title">${a.statut}</div><div class="tk-value">${esc(a.activite)} · ${fmtDate(a.dateDebut)}${a.echeance && a.echeance.getTime()!==a.dateDebut.getTime() ? ' → '+fmtDate(a.echeance) : ''}</div></div>
          </div>`).join('')}
        ${(!conges.length && !astreintesFormations.length) ? '<div class="empty-note">Aucune absence ni astreinte sur la période.</div>' : ''}
      </div>
    </div>

    <div class="panel" style="margin-bottom:18px;">
      <h2>Contexte et commentaires</h2>
      <p style="color:var(--text-faint);font-size:12px;margin:0 0 14px;">Ce que les chiffres ne montrent pas — à toi de le rédiger avant partage</p>
      <textarea class="rp-comment-box" id="rp-comment" placeholder="Ex : Ce trimestre a été en partie mobilisé par la gestion opérationnelle (astreintes, réunions GT IA). Les blocages en attente ne dépendent pas de moi.">${esc(savedComment)}</textarea>
      <p class="rp-comment-hint">Rien n'est envoyé automatiquement : ce texte est sauvegardé dans ton navigateur pour cette période, à toi de le relire et de partager le rapport quand tu es prêt (impression, PDF, ou copier-coller).</p>
    </div>
  `;

  document.getElementById('rp-comment').addEventListener('change', (e) => {
    localStorage.setItem(commentKey, e.target.value);
  });
}

    else showConfigScreen(config);

    document.getElementById('app').innerHTML =
      `<div class="error">Erreur d'initialisation : ${esc(e.message)}<br/>
       <a href="#" onclick="showConfigScreen(null)" style="color:var(--accent);">Reconfigurer</a></div>`;
  }
});
</script>
