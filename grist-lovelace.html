<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Grist - Activités & Projets</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: #2d3748;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      margin-bottom: 30px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    /* === KPI CARDS === */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .kpi-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    .kpi-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .kpi-value {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .kpi-label {
      font-size: 0.875rem;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .kpi-subtext {
      font-size: 0.75rem;
      color: #a0aec0;
      margin-top: 8px;
    }

    /* === CHARTS SECTION === */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.3);
    }

    .chart-card h3 {
      color: #2d3748;
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    .chart-container {
      position: relative;
      height: 300px;
    }

    /* === TIMELINE === */
    .timeline-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .timeline-item {
      display: flex;
      align-items: center;
      padding: 16px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.05) 100%);
      border-radius: 12px;
      border-left: 4px solid #667eea;
      transition: all 0.3s ease;
    }

    .timeline-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 12px rgba(102,126,234,0.2);
    }

    .timeline-date {
      font-weight: 600;
      color: #667eea;
      min-width: 100px;
      font-size: 0.875rem;
    }

    .timeline-content {
      flex: 1;
      padding: 0 16px;
    }

    .timeline-title {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 4px;
    }

    .timeline-project {
      font-size: 0.75rem;
      color: #718096;
    }

    .timeline-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-haute {
      background: #fed7d7;
      color: #c53030;
    }

    .badge-normale {
      background: #bee3f8;
      color: #2c5282;
    }

    /* === TABLE === */
    .table-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 0.875rem;
      text-transform: uppercase;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    tr:hover {
      background: rgba(102,126,234,0.05);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s ease;
    }

    @media (max-width: 768px) {
      .kpi-grid, .charts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📊 Dashboard Activités & Projets</h1>

    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>📈 Statuts des Activités</h3>
        <div class="chart-container">
          <canvas id="statutChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>📦 Activités par Projet</h3>
        <div class="chart-container">
          <canvas id="projetChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="timeline-card">
      <h3>🗓️ Prochaines Échéances (30 jours)</h3>
      <div id="timelineContainer"></div>
    </div>

    <!-- Table Projets -->
    <div class="table-card">
      <h3>📋 Vue d'ensemble des Projets</h3>
      <table id="projetsTable">
        <thead>
          <tr>
            <th>Projet</th>
            <th>Responsable</th>
            <th>Statut</th>
            <th>Activités ouvertes</th>
            <th>Avancement</th>
            <th>Date Cible</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    let activites = [];
    let projets = [];

    // Connexion à Grist
    grist.ready({
      requiredAccess: 'read table',
      columns: [
        { name: 'Activité', optional: false },
        { name: 'Projet', optional: false },
        { name: 'Statut', optional: false },
        { name: 'Priorité', optional: true },
        { name: 'Responsable', optional: true },
        { name: 'Date_Début', optional: true },
        { name: 'Echéance', optional: true },
        { name: 'Avancement', optional: true }
      ]
    });

    grist.onRecords((records) => {
      activites = records;
      fetchProjets();
    });

    async function fetchProjets() {
      try {
        const tables = await grist.docApi.fetchTable('PROJETS');
        projets = tables;
        renderDashboard();
      } catch (e) {
        console.warn('Table PROJETS non trouvée, utilisation des projets depuis activités');
        renderDashboard();
      }
    }

    function renderDashboard() {
      renderKPIs();
      renderCharts();
      renderTimeline();
      renderProjetsTable();
    }

    function renderKPIs() {
      const enCours = activites.filter(a => a.Statut === 'En cours').length;
      const termines = activites.filter(a => a.Statut === 'Terminé').length;
      const enAttente = activites.filter(a => a.Statut === 'En attente').length;
      const aLancer = activites.filter(a => a.Statut === 'À lancer').length;
      
      const avgAvancement = activites.length > 0 
        ? Math.round(activites.reduce((sum, a) => sum + (a.Avancement || 0), 0) / activites.length)
        : 0;

      const projetsUniques = [...new Set(activites.map(a => a.Projet))].length;

      const prochaines = activites
        .filter(a => a.Echéance && new Date(a.Echéance) > new Date())
        .sort((a, b) => new Date(a.Echéance) - new Date(b.Echéance));
      
      const prochaineEcheance = prochaines[0]?.Echéance 
        ? new Date(prochaines[0].Echéance).toLocaleDateString('fr-FR')
        : 'Aucune';

      const kpis = [
        { icon: '🚀', value: enCours, label: 'En cours', subtext: `${termines} terminées`, color: '#667eea' },
        { icon: '✅', value: termines, label: 'Terminées', subtext: `${enAttente} en attente`, color: '#48bb78' },
        { icon: '📦', value: projetsUniques, label: 'Projets actifs', subtext: `${activites.length} activités`, color: '#ed8936' },
        { icon: '📊', value: `${avgAvancement}%`, label: 'Avancement moyen', subtext: 'Toutes activités', color: '#9f7aea' },
        { icon: '⏰', value: aLancer, label: 'À lancer', subtext: prochaineEcheance, color: '#f56565' }
      ];

      document.getElementById('kpiGrid').innerHTML = kpis.map(kpi => `
        <div class="kpi-card">
          <div class="kpi-header">
            <div class="kpi-icon" style="background: ${kpi.color}20; color: ${kpi.color};">
              ${kpi.icon}
            </div>
            <div>
              <div class="kpi-label">${kpi.label}</div>
            </div>
          </div>
          <div class="kpi-value">${kpi.value}</div>
          <div class="kpi-subtext">${kpi.subtext}</div>
        </div>
      `).join('');
    }

    function renderCharts() {
      // Chart 1: Statuts
      const statutCounts = {
        'Terminé': activites.filter(a => a.Statut === 'Terminé').length,
        'En cours': activites.filter(a => a.Statut === 'En cours').length,
        'En attente': activites.filter(a => a.Statut === 'En attente').length,
        'À lancer': activites.filter(a => a.Statut === 'À lancer').length
      };

      new Chart(document.getElementById('statutChart'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(statutCounts),
          datasets: [{
            data: Object.values(statutCounts),
            backgroundColor: ['#48bb78', '#667eea', '#ed8936', '#f56565'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });

      // Chart 2: Activités par projet
      const projetCounts = {};
      activites.forEach(a => {
        projetCounts[a.Projet] = (projetCounts[a.Projet] || 0) + 1;
      });

      const top5Projets = Object.entries(projetCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      new Chart(document.getElementById('projetChart'), {
        type: 'bar',
        data: {
          labels: top5Projets.map(p => p[0].length > 30 ? p[0].substring(0, 30) + '...' : p[0]),
          datasets: [{
            label: 'Nombre d\'activités',
            data: top5Projets.map(p => p[1]),
            backgroundColor: 'rgba(102, 126, 234, 0.8)',
            borderRadius: 8
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function renderTimeline() {
      const now = new Date();
      const dans30j = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);

      const prochaines = activites
        .filter(a => {
          if (!a.Echéance || a.Statut === 'Terminé') return false;
          const echeance = new Date(a.Echéance);
          return echeance >= now && echeance <= dans30j;
        })
        .sort((a, b) => new Date(a.Echéance) - new Date(b.Echéance))
        .slice(0, 10);

      const html = prochaines.length > 0 ? prochaines.map(a => `
        <div class="timeline-item">
          <div class="timeline-date">${new Date(a.Echéance).toLocaleDateString('fr-FR')}</div>
          <div class="timeline-content">
            <div class="timeline-title">${a.Activité || 'Sans titre'}</div>
            <div class="timeline-project">${a.Projet || 'Sans projet'}</div>
          </div>
          <div class="timeline-badge ${a.Priorité === 'Haute' ? 'badge-haute' : 'badge-normale'}">
            ${a.Priorité || 'Normale'}
          </div>
        </div>
      `).join('') : '<p style="color: #718096; text-align: center;">Aucune échéance dans les 30 prochains jours</p>';

      document.getElementById('timelineContainer').innerHTML = html;
    }

    function renderProjetsTable() {
      const projetStats = {};
      
      activites.forEach(a => {
        if (!projetStats[a.Projet]) {
          projetStats[a.Projet] = {
            nom: a.Projet,
            responsable: a.Responsable || '—',
            statut: 'En cours',
            ouvertes: 0,
            total: 0,
            avancement: 0
          };
        }
        projetStats[a.Projet].total++;
        if (a.Statut !== 'Terminé') projetStats[a.Projet].ouvertes++;
        projetStats[a.Projet].avancement += (a.Avancement || 0);
      });

      const tbody = document.querySelector('#projetsTable tbody');
      tbody.innerHTML = Object.values(projetStats).map(p => {
        const avgAvancement = Math.round(p.avancement / p.total);
        return `
          <tr>
            <td><strong>${p.nom}</strong></td>
            <td>${p.responsable}</td>
            <td>${p.statut}</td>
            <td>${p.ouvertes}</td>
            <td>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${avgAvancement}%"></div>
              </div>
              ${avgAvancement}%
            </td>
            <td>2026-12-31</td>
          </tr>
        `;
      }).join('');
    }
  </script>

</body>
</html>
