<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 60px 20px;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      margin: 0;
    }
    #status {
      font-size: 24px;
      margin: 30px auto;
      padding: 30px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      max-width: 500px;
      backdrop-filter: blur(10px);
    }
    .loading::after {
      content: '.';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
      80%, 100% { content: ''; }
    }
    .success { color: #4ade80; font-weight: bold; }
    .error { color: #fca5a5; font-weight: bold; }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🎯 Chargement de la station</h1>
  <div class="spinner"></div>
  <div id="status" class="loading">Recherche en cours</div>
  
  <script>
    grist.ready();
    
    async function redirectToStation() {
      const statusEl = document.getElementById('status');
      
      try {
        // Récupérer le paramètre 'code' de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const codeStation = urlParams.get('code');
        
        if (!codeStation) {
          statusEl.className = 'error';
          statusEl.innerHTML = '❌ Erreur<br><small>Aucun code de station fourni dans l\'URL</small>';
          return;
        }
        
        statusEl.innerHTML = `🔍 Recherche de la station<br><strong>${codeStation}</strong>`;
        
        // Charger la table stations
        const tableData = await grist.docApi.fetchTable('stations');
        
        // Chercher la station correspondante
        const index = tableData.code_station.findIndex(
          code => code && code.trim().toLowerCase() === codeStation.trim().toLowerCase()
        );
        
        if (index === -1) {
          statusEl.className = 'error';
          statusEl.innerHTML = `❌ Station non trouvée<br><strong>${codeStation}</strong><br><small>Vérifiez le code</small>`;
          return;
        }
        
        // Récupérer les infos de la station
        const rowId = tableData.id[index];
        const nomStation = tableData.nom_station_hydro[index];
        
        statusEl.className = 'success';
        statusEl.innerHTML = `✅ Station trouvée !<br><strong>${nomStation}</strong><br><small>Redirection...</small>`;
        
        // Rediriger vers la page fiche (p/10) avec l'ID de ligne
        setTimeout(() => {
          window.location.href = 
            `https://grist.numerique.gouv.fr/o/docs/sK6Mx2g2fVvo/Document-sans-titre/p/10?stations=${rowId}`;
        }, 800);
        
      } catch (error) {
        statusEl.className = 'error';
        statusEl.innerHTML = `❌ Erreur technique<br><small>${error.message}</small>`;
        console.error('Erreur:', error);
      }
    }
    
    // Attendre que Grist soit prêt puis lancer la recherche
    setTimeout(redirectToStation, 500);
  </script>
</body>
</html>
